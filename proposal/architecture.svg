<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
  <title id="title">Language implementation architecture</title>
  <desc id="desc">The parser transforms source code into the core representation defined by the core language. The interpreter checks purity and executes the core representation only if the checks pass; failed checks reject the program with diagnostics. The compiler lowers core into an intermediate representation, checks purity, and generates Rust only if those checks pass. Failed checks produce diagnostics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; text-anchor: middle; }
      .heading { font-size: 18px; font-weight: 700; }
      .detail { font-size: 14px; fill: #475569; }
      .label { font-size: 13px; fill: #475569; }
      .node { fill: #fff; stroke: #64748b; stroke-width: 1.6; }
      .data { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .flow { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="530" fill="white"/>

  <path d="M685 145 V87" class="flow"/>
  <text x="705" y="121" class="label">fail</text>
  <rect x="610" y="27" width="150" height="60" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
  <text x="685" y="52" class="heading">Diagnostics</text>
  <text x="685" y="73" class="detail">Program rejected</text>

  <g transform="translate(0,70)">
  <rect x="525" y="187" width="575" height="252" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="558" y="214" class="heading" style="text-anchor:start">Compiler</text>

  <rect x="315" y="20" width="180" height="68" rx="9" class="data"/>
  <text x="405" y="48" class="heading">Core language</text>
  <text x="405" y="70" class="detail">Syntax and semantics</text>
  <path d="M405 88 V144" class="flow" stroke-dasharray="5 4"/>
  <text x="438" y="119" class="label">defines</text>

  <rect x="20" y="145" width="120" height="70" rx="9" class="data"/>
  <text x="80" y="185" class="heading">Source code</text>
  <path d="M140 180 H175" class="flow"/>
  <rect x="175" y="145" width="105" height="70" rx="9" class="node"/>
  <text x="227.5" y="185" class="heading">Parser</text>
  <path d="M280 180 H315" class="flow"/>
  <rect x="315" y="145" width="180" height="70" rx="9" class="data"/>
  <text x="405" y="175" class="heading">Core representation</text>
  <text x="405" y="198" class="detail">Shared program structure</text>

  <path d="M495 165 H550 V110 H600" class="flow"/>
  <rect x="600" y="75" width="170" height="70" rx="9" class="node"/>
  <text x="685" y="105" class="heading">Interpreter</text>
  <text x="685" y="128" class="detail">Checks purity, runs</text>
  <path d="M770 110 H825" class="flow"/>
  <text x="797.5" y="97" class="label">pass</text>
  <rect x="825" y="75" width="225" height="70" rx="9" class="data"/>
  <text x="937.5" y="105" class="heading">Execution result</text>
  <text x="937.5" y="128" class="detail">Final state or runtime error</text>

  <path d="M495 195 H510 V280 H545" class="flow"/>
  <rect x="545" y="245" width="110" height="70" rx="9" class="node"/>
  <text x="600" y="275" class="heading">Lowering</text>
  <text x="600" y="298" class="detail">Core to IR</text>
  <path d="M655 280 H685" class="flow"/>
  <rect x="685" y="245" width="155" height="70" rx="9" class="data"/>
  <text x="762.5" y="275" class="heading">IR + purity checks</text>
  <text x="762.5" y="298" class="detail">Validate declared effects</text>
  <path d="M840 280 H880" class="flow"/>
  <text x="860" y="267" class="label">pass</text>
  <rect x="880" y="245" width="105" height="70" rx="9" class="node"/>
  <text x="932.5" y="275" class="heading">Rust code</text>
  <text x="932.5" y="298" class="detail">generation</text>
  <path d="M985 280 H1010" class="flow"/>
  <rect x="1010" y="245" width="75" height="70" rx="9" class="data"/>
  <text x="1047.5" y="275" class="heading">Target</text>
  <text x="1047.5" y="298" class="detail">Rust</text>
  <path d="M762.5 315 V355" class="flow"/>
  <text x="783" y="340" class="label">fail</text>
  <rect x="685" y="355" width="155" height="60" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
  <text x="762.5" y="380" class="heading">Diagnostics</text>
  <text x="762.5" y="401" class="detail">Program rejected</text>
  </g>
</svg>
