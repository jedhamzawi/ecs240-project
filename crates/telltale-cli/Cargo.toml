[package]
name = "telltale-cli"
version = "0.1.0"
edition = "2024"
description = "The CLI for interacting with the Telltale toy programming language, a project for ECS240 at UC Davis"
authors.workspace = true

[[bin]]
name = "tt"
path = "src/main.rs"

[dependencies]
# telltale component dependencies
telltale-core = { workspace = true }
telltale-parser = { workspace = true }
telltale-interpreter = { workspace = true }
telltale-compiler = { workspace = true }

# other `tt` CLI dependencies
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0.104"
